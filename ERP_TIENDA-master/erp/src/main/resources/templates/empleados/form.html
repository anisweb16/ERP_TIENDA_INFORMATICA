<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Formulario Empleado | ERP Tienda Gaming')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>

  <main class="content">
    <div class="page-header">
      <div>
        <h1 class="page-title" th:text="${empleado.id != null} ? 'Editar empleado' : 'Nuevo empleado'">Nuevo empleado</h1>
        <p class="page-subtitle">Completa los datos y guarda.</p>
      </div>
      <a class="btn" th:href="@{/empleados}"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    </div>

    <section class="panel">
      <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-grid">
          <div class="field full">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required />
          </div>

          <div class="field">
            <label>Puesto</label>
            <input type="text" th:field="*{puesto}" required />
          </div>

          <div class="field">
            <label>Salario (€)</label>
            <input type="number" step="0.01" th:field="*{salario}" required />
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
          <a class="btn ghost" th:href="@{/empleados}">Cancelar</a>
          <button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
