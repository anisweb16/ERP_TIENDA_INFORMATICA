<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Formulario Compra | ERP Tienda Gaming')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${compra.id != null} ? 'Editar compra' : 'Nueva compra'">Nueva compra</h1>
                <p class="page-subtitle">Proveedor, fecha, estado y líneas de productos.</p>
            </div>
            <a class="btn" th:href="@{/compras}"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>

        <section class="panel">
            <form th:action="@{/compras/guardar}" th:object="${compra}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-grid">
                    <div class="field full">
                        <label>Proveedor</label>
                        <select th:field="*{proveedor.id}" required style="background-color: #0b1230; color: #e9eefc;">
                            <option value="" disabled selected>Selecciona un proveedor…</option>
                            <option th:each="p : ${proveedores}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Fecha</label>
                        <input type="date" th:field="*{fecha}" required />
                    </div>

                    <div class="field">
                        <label>Estado</label>
                        <input type="text" th:field="*{estado}" required />
                    </div>

                    <div class="field full">
                        <label>Método de pago</label>
                        <input type="text" th:field="*{metodoPago}" />
                    </div>
                </div>

                <div style="margin-top:16px" class="kpi-top"><i class="fa-solid fa-list"></i> Detalles de compra</div>

                <div class="invoice-table-box" style="margin-top:12px">
                    <table class="invoice-lines">
                        <thead>
                        <tr>
                            <th style="width:40%">Producto</th>
                            <th style="width:15%">Precio unit.</th>
                            <th style="width:20%">Cantidad</th>
                            <th style="width:15%">Subtotal</th>
                            <th style="width:10%">Acción</th>
                        </tr>
                        </thead>
                        <tbody id="detallesCompra">
                        <tr>
                            <td>
                                <select name="productoIds" required style="background-color: #0b1230; color: #e9eefc;">
                                    <option value="" disabled selected>Selecciona producto…</option>
                                    <option th:each="p : ${productos}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}"
                                            th:data-precio="${p.precio}">
                                    </option>
                                </select>
                            </td>
                            <td class="num">
                                <input type="number"
                                       step="0.01"
                                       name="preciosUnitarios"
                                       value="0"
                                       min="0"
                                       style="width:100%">
                            </td>
                            <td>
                                <input type="number"
                                       name="cantidades"
                                       value="1"
                                       min="1"
                                       required>
                            </td>
                            <td class="num">
                                <span class="subtotal-compra">0.00</span>
                            </td>
                            <td style="text-align:center;">
                                <button class="btn danger" type="button" onclick="eliminarFilaCompra(this)">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <table class="invoice-total" style="margin-top:10px">
                    <tr>
                        <th>Total compra</th>
                        <td class="num" id="totalCompraDisplay">0.00</td>
                    </tr>
                </table>

                <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px">
                    <button class="btn" type="button" onclick="agregarFilaCompra()">
                        <i class="fa-solid fa-plus"></i> Agregar producto
                    </button>
                    <button class="btn primary" type="submit">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar compra
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<script>
    function actualizarFilaCompra(fila) {
      const select = fila.querySelector('select[name="productoIds"]');
      const precioInput = fila.querySelector('input[name="preciosUnitarios"]');
      const cantidadInput = fila.querySelector('input[name="cantidades"]');
      const subtotalSpan = fila.querySelector('.subtotal-compra');

      let precio = 0;
      if (precioInput) {
        precio = parseFloat(precioInput.value || '0');
      }

      if (precio === 0 && select && select.value) {
        const opt = select.options[select.selectedIndex];
        const raw = opt.getAttribute('data-precio') || opt.dataset.precio;
        if (raw) {
          precio = parseFloat(raw) || 0;
          if (precioInput) precioInput.value = precio.toFixed(2);
        }
      }

      const cantidad = cantidadInput ? parseInt(cantidadInput.value || '0', 10) : 0;
      const subtotal = (isNaN(precio) ? 0 : precio) * (isNaN(cantidad) ? 0 : cantidad);

      if (subtotalSpan) subtotalSpan.textContent = subtotal.toFixed(2);
    }

    function actualizarTotalCompra() {
      const subtotales = document.querySelectorAll('.subtotal-compra');
      let total = 0;
      subtotales.forEach(span => {
        const v = parseFloat(span.textContent || '0');
        if (!isNaN(v)) total += v;
      });
      const totalCell = document.getElementById('totalCompraDisplay');
      if (totalCell) totalCell.textContent = total.toFixed(2);
    }

    function inicializarEventosFilaCompra(fila) {
      const select = fila.querySelector('select[name="productoIds"]');
      const precioInput = fila.querySelector('input[name="preciosUnitarios"]');
      const cantidadInput = fila.querySelector('input[name="cantidades"]');

      if (select) {
        select.addEventListener('change', () => {
          actualizarFilaCompra(fila);
          actualizarTotalCompra();
        });
      }
      if (precioInput) {
        precioInput.addEventListener('input', () => {
          actualizarFilaCompra(fila);
          actualizarTotalCompra();
        });
      }
      if (cantidadInput) {
        cantidadInput.addEventListener('input', () => {
          actualizarFilaCompra(fila);
          actualizarTotalCompra();
        });
      }

      actualizarFilaCompra(fila);
      actualizarTotalCompra();
    }

    function agregarFilaCompra() {
      const tbody = document.getElementById('detallesCompra');
      const fila = tbody.querySelector('tr');
      const nueva = fila.cloneNode(true);

      nueva.querySelectorAll('select[name="productoIds"]').forEach(select => select.selectedIndex = 0);
      nueva.querySelectorAll('input[name="preciosUnitarios"]').forEach(input => input.value = '0');
      nueva.querySelectorAll('input[name="cantidades"]').forEach(input => input.value = '1');
      nueva.querySelectorAll('.subtotal-compra').forEach(span => span.textContent = '0.00');

      tbody.appendChild(nueva);
      inicializarEventosFilaCompra(nueva);
    }

    function eliminarFilaCompra(btn) {
      const filas = document.querySelectorAll('#detallesCompra tr');
      if (filas.length > 1) {
        btn.closest('tr').remove();
        actualizarTotalCompra();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#detallesCompra tr').forEach(fila => {
        inicializarEventosFilaCompra(fila);
      });
    });
</script>

</body>
</html>
