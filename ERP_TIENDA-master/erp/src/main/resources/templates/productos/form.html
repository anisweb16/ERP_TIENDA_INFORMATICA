<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Formulario Producto | ERP Tienda Gaming')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>

  <main class="content">
    <div class="page-header">
      <div>
        <h1 class="page-title" th:text="${producto.id != null} ? 'Editar producto' : 'Nuevo producto'">Nuevo producto</h1>
        <p class="page-subtitle">Define categoría, precio y stock.</p>
      </div>
      <a class="btn" th:href="@{/productos}"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    </div>

    <section class="panel">
      <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-grid">
          <div class="field full">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required />
          </div>

          <div class="field">
            <label>Precio (€)</label>
            <input type="number" step="0.01" th:field="*{precio}" required />
          </div>

          <div class="field">
            <label>Stock</label>
            <input type="number" th:field="*{stock}" required />
          </div>

          <div class="field full">
            <label>Tipo de producto</label>
            <select th:field="*{esCompuesto}" style="background-color: #0b1230; color: #e9eefc;">
              <option th:value="false">Simple</option>
              <option th:value="true">Compuesto (con escandallo)</option>
            </select>
            <p class="helper" th:if="${producto.id != null and producto.esCompuesto}">
              <a th:href="@{/produccion/escandallo/{id}(id=${producto.id})}" class="link"><i class="fa-solid fa-list"></i> Gestionar escandallo</a>
            </p>
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
          <a class="btn ghost" th:href="@{/productos}">Cancelar</a>
          <button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
