<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Formulario Venta | ERP Tienda Gaming')}"></head>

<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">

        <!-- HEADER -->
        <div class="page-header">
            <div>
                <h1 class="page-title"
                    th:text="${pedido.id != null} ? 'Editar venta' : 'Nueva venta'">
                    Nueva venta
                </h1>
                <p class="page-subtitle">Cliente, estado y líneas de productos.</p>
            </div>

            <a class="btn" th:href="@{/ventas}">
                ← Volver
            </a>
        </div>

        <!-- PANEL -->
        <section class="panel">

            <form th:action="@{/ventas/guardar}"
                  th:object="${pedido}"
                  method="post">

                <input type="hidden" th:field="*{id}" />

                <!-- CABECERA -->
                <div class="form-grid">

                    <div class="field full">
                        <label>Cliente</label>
                        <select th:field="*{cliente.id}" required style="background-color: #0b1230; color: #e9eefc;">
                            <option value="" disabled selected>Selecciona cliente…</option>
                            <option th:each="c : ${clientes}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Fecha</label>
                        <input type="date" th:field="*{fecha}" />
                    </div>

                    <div class="field">
                        <label>Estado</label>
                        <select th:field="*{estado}" required style="background-color: #0b1230; color: #e9eefc;">
                            <option value="" disabled selected>Selecciona estado…</option>
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="PAGADO">PAGADO</option>
                            <option value="ENTREGADO">ENTREGADO</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label>Método de pago</label>
                        <input type="text" th:field="*{metodoPago}" />
                    </div>

                </div>

                <!-- DETALLES -->
                <h3 style="margin-top:30px;">Detalles de venta</h3>

                <div class="invoice-table-box">
                    <table class="invoice-lines">
                        <thead>
                        <tr>
                            <th style="width:40%">Producto</th>
                            <th style="width:15%">Precio</th>
                            <th style="width:20%">Cantidad</th>
                            <th style="width:15%">Subtotal</th>
                            <th style="width:10%">Acción</th>
                        </tr>
                        </thead>

                        <tbody id="detallesVenta">
                        <tr>
                            <td>
                                <select name="productoIds" required style="background-color: #0b1230; color: #e9eefc;">
                                    <option value="" disabled selected>Selecciona producto…</option>
                                    <option th:each="p : ${productos}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}"
                                            th:data-precio="${p.precio}">
                                    </option>
                                </select>
                            </td>

                            <td class="num">
                                <span class="precio-linea">0.00</span>
                            </td>

                            <td>
                                <input type="number"
                                       name="cantidades"
                                       value="1"
                                       min="1"
                                       required>
                            </td>

                            <td class="num">
                                <span class="subtotal-linea">0.00</span>
                            </td>

                            <td style="text-align:center;">
                                <button type="button"
                                        class="btn danger"
                                        onclick="eliminarFilaVenta(this)">
                                    ✕
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <table class="invoice-total">
                    <tr>
                        <th>Total venta</th>
                        <td class="num" id="totalVentaDisplay">0.00</td>
                    </tr>
                </table>

                <div style="margin-top:15px;">
                    <button type="button"
                            class="btn ghost"
                            onclick="agregarFilaVenta()">
                        + Agregar producto
                    </button>
                </div>

                <!-- BOTÓN GUARDAR -->
                <div style="display:flex;justify-content:flex-end;margin-top:30px;">
                    <button type="submit" class="btn primary">
                        💾 Guardar venta
                    </button>
                </div>

            </form>
        </section>
    </main>
</div>

<!-- SCRIPT -->
<script>
    function actualizarFilaVenta(fila) {
        const select = fila.querySelector('select[name="productoIds"]');
        const qtyInput = fila.querySelector('input[name="cantidades"]');
        const precioSpan = fila.querySelector('.precio-linea');
        const subtotalSpan = fila.querySelector('.subtotal-linea');

        let precio = 0;
        if (select && select.value) {
            const opt = select.options[select.selectedIndex];
            const raw = opt.getAttribute('data-precio') || opt.dataset.precio;
            precio = raw ? parseFloat(raw) : 0;
        }

        const cantidad = qtyInput ? parseInt(qtyInput.value || '0', 10) : 0;
        const subtotal = precio * (isNaN(cantidad) ? 0 : cantidad);

        if (precioSpan) precioSpan.textContent = precio.toFixed(2);
        if (subtotalSpan) subtotalSpan.textContent = subtotal.toFixed(2);
    }

    function actualizarTotalVenta() {
        const subtotales = document.querySelectorAll('.subtotal-linea');
        let total = 0;
        subtotales.forEach(span => {
            const v = parseFloat(span.textContent || '0');
            if (!isNaN(v)) total += v;
        });
        const totalCell = document.getElementById('totalVentaDisplay');
        if (totalCell) totalCell.textContent = total.toFixed(2);
    }

    function inicializarEventosFilaVenta(fila) {
        const select = fila.querySelector('select[name="productoIds"]');
        const qtyInput = fila.querySelector('input[name="cantidades"]');

        if (select) {
            select.addEventListener('change', () => {
                actualizarFilaVenta(fila);
                actualizarTotalVenta();
            });
        }
        if (qtyInput) {
            qtyInput.addEventListener('input', () => {
                actualizarFilaVenta(fila);
                actualizarTotalVenta();
            });
        }

        actualizarFilaVenta(fila);
        actualizarTotalVenta();
    }

    function agregarFilaVenta() {
        const tbody = document.getElementById('detallesVenta');
        const fila = tbody.querySelector('tr');
        const nueva = fila.cloneNode(true);

        nueva.querySelectorAll('input[name="cantidades"]').forEach(input => input.value = 1);
        nueva.querySelectorAll('select[name="productoIds"]').forEach(select => select.selectedIndex = 0);
        nueva.querySelectorAll('.precio-linea').forEach(span => span.textContent = '0.00');
        nueva.querySelectorAll('.subtotal-linea').forEach(span => span.textContent = '0.00');

        tbody.appendChild(nueva);
        inicializarEventosFilaVenta(nueva);
    }

    function eliminarFilaVenta(btn) {
        const filas = document.querySelectorAll('#detallesVenta tr');
        if (filas.length > 1) {
            btn.closest('tr').remove();
            actualizarTotalVenta();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#detallesVenta tr').forEach(fila => {
            inicializarEventosFilaVenta(fila);
        });
    });
</script>

</body>
</html>
